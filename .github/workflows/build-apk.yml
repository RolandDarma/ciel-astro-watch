name: Compiler l'APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Le runner GitHub embarque déjà le SDK Android : on se contente
      # d'accepter les licences et de s'assurer que la plateforme 35 est là.
      # (l'action setup-android reste bloquée sur l'invite des licences)
      - name: Licences et plateforme Android
        run: |
          SDK="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK utilisé : $SDK"
          yes | "$SDK/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$SDK/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0" || true

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilation
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: APK en pièce jointe du run
        uses: actions/upload-artifact@v4
        with:
          name: CielAstro-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publier l'APK dans la release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest -y --cleanup-tag || true
          gh release create latest app/build/outputs/apk/debug/app-debug.apk \
            --title "Dernier APK" \
            --notes "Build automatique du commit ${{ github.sha }}"
